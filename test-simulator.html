<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Bot AI Live Simulator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background: #0c1317; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .chat-container { width: 100%; max-width: 440px; height: 650px; background: #111b21; border-radius: 20px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 16px 40px rgba(0,0,0,0.6); border: 1px solid #222e35; }
    .chat-header { background: #202c33; padding: 14px 18px; display: flex; align-items: center; gap: 12px; color: #e9edef; border-bottom: 1px solid #2a3942; }
    .avatar { width: 44px; height: 44px; border-radius: 50%; background: #00a884; display: flex; align-items: center; justify-content: center; font-size: 22px; }
    .header-info h3 { font-size: 16px; font-weight: 600; color: #e9edef; }
    .header-info p { font-size: 12px; color: #25d366; display: flex; align-items: center; gap: 4px; }
    .header-info p::before { content: ""; width: 7px; height: 7px; background: #25d366; border-radius: 50%; display: inline-block; }
    .chat-body { flex: 1; padding: 16px; overflow-y: auto; background-color: #0b141a; background-image: radial-gradient(#1f2c34 1px, transparent 1px); background-size: 16px 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 82%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.45; word-wrap: break-word; white-space: pre-wrap; }
    .msg-user { align-self: flex-end; background: #005c4b; color: #e9edef; border-bottom-right-radius: 2px; }
    .msg-bot { align-self: flex-start; background: #202c33; color: #e9edef; border-bottom-left-radius: 2px; }
    .msg-time { font-size: 10px; color: rgba(255,255,255,0.5); text-align: right; margin-top: 4px; }
    .typing { display: none; align-self: flex-start; background: #202c33; color: #8696a0; font-size: 13px; font-style: italic; padding: 8px 14px; border-radius: 12px; }
    .chat-footer { background: #202c33; padding: 12px 14px; display: flex; align-items: center; gap: 10px; border-top: 1px solid #2a3942; }
    .chat-input { flex: 1; background: #2a3942; border: none; outline: none; color: #d1d7db; padding: 12px 16px; border-radius: 24px; font-size: 14px; }
    .chat-input::placeholder { color: #8696a0; }
    .send-btn { background: #00a884; border: none; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #111b21; transition: transform 0.15s; }
    .send-btn:hover { transform: scale(1.05); }
    .presets { display: flex; gap: 6px; overflow-x: auto; padding: 8px 12px; background: #182229; border-top: 1px solid #222e35; }
    .preset-btn { background: #222e35; border: 1px solid #2a3942; color: #00a884; font-size: 11px; padding: 5px 10px; border-radius: 12px; cursor: pointer; white-space: nowrap; }
    .preset-btn:hover { background: #2a3942; }
  </style>
</head>
<body>

<div class="chat-container">
<div class="server-bar" style="background: #182229; padding: 8px 14px; border-bottom: 1px solid #2a3942; display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #8696a0; gap: 8px;">
    <div style="display: flex; align-items: center; gap: 6px; flex: 1;">
      <span style="white-space: nowrap;">API Server:</span>
      <input type="text" id="serverUrlInput" value="http://65.0.101.92" style="background: #2a3942; border: 1px solid #3b4a54; color: #e9edef; font-size: 12px; padding: 4px 8px; border-radius: 6px; flex: 1; outline: none;" placeholder="e.g. http://65.0.101.92" onchange="saveServerUrl()" />
      <button onclick="checkServerHealth()" style="background: #00a884; border: none; color: #111b21; padding: 4px 10px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 11px;">Ping</button>
    </div>
    <span id="serverStatusBadge" style="padding: 2px 8px; border-radius: 10px; font-size: 11px; background: #3b4a54; color: #aebac1; white-space: nowrap;">Checking...</span>
  </div>

  <div class="chat-header">
    <div class="avatar">🤖</div>
    <div class="header-info">
      <h3>AI WhatsApp Assistant (Live)</h3>
      <p id="headerStatusText">Ready for Testing</p>
    </div>
    <div style="margin-left: auto;">
      <a id="dashboardLink" href="http://localhost:3000" target="_blank" style="color: #00a884; font-size: 11px; text-decoration: none; background: #222e35; border: 1px solid #2a3942; padding: 4px 8px; border-radius: 6px;">Open CRM ↗</a>
    </div>
  </div>

  <div class="chat-body" id="chatBody">
    <div class="msg msg-bot">
      Namaste! Main aapka AI assistant hoon. Aap mujhse Menu, Products, Booking ya Order status ke baare me pooch sakte hain!
      <div class="msg-time">Just now</div>
    </div>
    <div class="typing" id="typingIndicator">AI Agent is thinking...</div>
  </div>

  <div class="presets">
    <button class="preset-btn" onclick="sendPreset('Hello, what products or menu do you have?')">🍕 View Menu</button>
    <button class="preset-btn" onclick="sendPreset('Can I book an appointment tomorrow?')">📅 Book Appointment</button>
    <button class="preset-btn" onclick="sendPreset('Where is my order #1001?')">📦 Track Order</button>
    <button class="preset-btn" onclick="sendPreset('I want to speak with a human support agent')">👤 Talk to Human</button>
  </div>

  <div class="chat-footer">
    <input type="text" id="userInput" class="chat-input" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMessage()" />
    <button class="send-btn" onclick="sendMessage()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </button>
  </div>
</div>

<script>
  const chatBody = document.getElementById('chatBody');
  const userInput = document.getElementById('userInput');
  const typingIndicator = document.getElementById('typingIndicator');
  const serverUrlInput = document.getElementById('serverUrlInput');
  const serverStatusBadge = document.getElementById('serverStatusBadge');
  const headerStatusText = document.getElementById('headerStatusText');
  const dashboardLink = document.getElementById('dashboardLink');

  function getServerUrl() {
    let url = (localStorage.getItem('ai_bot_api_url') || serverUrlInput.value || 'http://65.0.101.92').replace(/\/+$/, '');
    if (url.includes(':3000')) {
      url = url.replace(':3000', '');
      localStorage.setItem('ai_bot_api_url', url);
      serverUrlInput.value = url;
    }
    return url;
  }

  function saveServerUrl() {
    let url = serverUrlInput.value.trim().replace(/\/+$/, '');
    if (!url.startsWith('http://') && !url.startsWith('https://')) {
      url = 'http://' + url;
    }
    if (url.includes(':3000')) {
      url = url.replace(':3000', '');
      alert('Note: Port 3000 is for Dashboard CRM. API connects on http://' + new URL(url).hostname);
    }
    serverUrlInput.value = url;
    localStorage.setItem('ai_bot_api_url', url);
    updateDashboardLink(url);
    checkServerHealth();
  }

  function updateDashboardLink(apiUrl) {
    try {
      const parsed = new URL(apiUrl);
      const dashboardUrl = `${parsed.protocol}//${parsed.hostname}:3000`;
      dashboardLink.href = dashboardUrl;
    } catch (e) {
      dashboardLink.href = 'http://localhost:3000';
    }
  }

  async function checkServerHealth() {
    const baseUrl = getServerUrl();
    serverStatusBadge.textContent = 'Pinging...';
    serverStatusBadge.style.background = '#3b4a54';
    serverStatusBadge.style.color = '#aebac1';

    try {
      const res = await fetch(`${baseUrl}/health`, { signal: AbortSignal.timeout(5000) });
      const data = await res.json();
      if (res.ok && (data.status === 'healthy' || data.status === 'ok' || data.service)) {
        serverStatusBadge.textContent = '🟢 Online';
        serverStatusBadge.style.background = '#005c4b';
        serverStatusBadge.style.color = '#25d366';
        headerStatusText.textContent = `Online • ${new URL(baseUrl).host}`;
      } else {
        serverStatusBadge.textContent = '⚠️ Degraded';
        serverStatusBadge.style.background = '#7a5a00';
        serverStatusBadge.style.color = '#ffd279';
      }
    } catch (err) {
      serverStatusBadge.textContent = '🔴 Offline';
      serverStatusBadge.style.background = '#5a1d1d';
      serverStatusBadge.style.color = '#ff8f8f';
      headerStatusText.textContent = 'Offline (Check URL/Port)';
    }
  }

  function appendMessage(text, type) {
    const div = document.createElement('div');
    div.className = 'msg msg-' + type;
    div.textContent = text;
    const time = document.createElement('div');
    time.className = 'msg-time';
    time.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    div.appendChild(time);
    chatBody.insertBefore(div, typingIndicator);
    chatBody.scrollTop = chatBody.scrollHeight;
  }

  function sendPreset(text) {
    userInput.value = text;
    sendMessage();
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;
    userInput.value = '';
    appendMessage(text, 'user');

    typingIndicator.style.display = 'block';
    chatBody.scrollTop = chatBody.scrollHeight;

    const baseUrl = getServerUrl();

    try {
      const response = await fetch(`${baseUrl}/api/v1/mock/whatsapp-inbound`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          text: text,
          senderPhone: '+919876543210',
          senderName: 'Rajnish'
        })
      });

      const result = await response.json();
      typingIndicator.style.display = 'none';

      if (result.success && result.data && result.data.reply) {
        appendMessage(result.data.reply, 'bot');
      } else {
        appendMessage('⚠️ Error: ' + (result.error?.message || 'Server error'), 'bot');
      }
    } catch (err) {
      typingIndicator.style.display = 'none';
      appendMessage(`⚠️ Could not connect to ${baseUrl}. Please ensure the API is running and accessible!`, 'bot');
    }
  }

  // Initialize on load
  const savedUrl = localStorage.getItem('ai_bot_api_url');
  if (savedUrl) {
    serverUrlInput.value = savedUrl;
  }
  updateDashboardLink(getServerUrl());
  checkServerHealth();
</script>

</body>
</html>
